<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI Editor gate: scorer-check stub</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 12px; }
  #stage { position: relative; display: inline-block; margin-top: 8px; border: 1px solid #ccc; }
  #cover { position: absolute; inset: 0; }
  [data-selection] { position: absolute; outline: 2px solid #e85d3f; pointer-events: none; }
  [data-handle] { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: #fff; border: 2px solid #e85d3f; pointer-events: auto; }
  [data-dot] { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e85d3f; }
  .row { margin: 4px 0; }
  #panel { margin-top: 8px; }
</style>
</head>
<body>
<!--
  The scorer-check stub: a deliberately small editor that follows the UI contract of docs/ui-editor-gate-rules.md just far enough
  to run actions S04, S05 and S09 through the real gate runner, with faults that can be switched on with ?fault=NAME:
    half-drag        moves and resizes by half the pointer distance (P1 must fail)
    drop-last-edit   exports the edit list without its last edit (P2 must fail)
    touch-neighbour  an edit also changes the next sibling's colour, in the preview and the export (P3 must fail)
    extra-line       the export has one extra added line (P4 must fail)
    no-dot           the unlinked dot is never drawn (P5 must fail)
  It is not the product; it only lets the scorer be checked before the page is built.
-->
<div data-editor>
  <div class="row">
    <label for="sample">Sample</label> <select id="sample"><option value="">(choose)</option><option value="landing">Landing page</option><option value="email">HTML email</option><option value="chart">SVG chart</option></select>
    <span role="group" aria-label="View"><button type="button" aria-pressed="true">Desktop</button><button type="button" aria-pressed="false">Tablet</button><button type="button" aria-pressed="false">Phone</button></span>
    <span data-env>Desktop</span>
    <button type="button" id="undo" disabled>Undo</button><button type="button" id="redo" disabled>Redo</button>
    <button type="button" id="review">Review unlinked (0)</button>
    <label for="file">File</label> <select id="file"></select>
    <button type="button" id="download">Download</button>
  </div>
  <div id="stage"></div>
  <div id="panel">
    <div data-selected-label></div>
    <div class="row"><input type="checkbox" id="link" checked> <label for="link" id="linklabel">Link to Phone</label></div>
    <div class="row" data-field="font-size"><label for="f-font-size">Font size</label> <input id="f-font-size" type="text"></div>
    <div class="row" data-field="width"><label for="f-width">Width</label> <input id="f-width" type="text"></div>
    <div class="row" data-field="height"><label for="f-height">Height</label> <input id="f-height" type="text"></div>
    <div class="row" data-field="position"><span>Position</span></div>
  </div>
  <div role="status" aria-label="Edit result" id="msg"></div>
</div>
<script type="module">
import * as E from '/engine.js'
const fault = new URLSearchParams(location.search).get('fault')
const FILES = { landing: ['landing.html', 'landing.css'], email: ['email.html'], chart: ['chart.svg'] }
const KIND = { landing: 'html', email: 'html', chart: 'svg' }
const WIDTH = { Desktop: 1280, Tablet: 768, Phone: 390 }
const $ = (s) => document.querySelector(s)
const root = $('[data-editor]')
let sample = null, originals = {}, edits = [], redo = [], preview = null, session = null, sel = null, view = 'Desktop', drag = null

async function textOf(f) { return (await fetch('/samples/' + f)).text() }
const modelOf = (files) => { const [main, ...rest] = FILES[sample]; return E.createModel(files[main], KIND[sample], Object.fromEntries(rest.map((r) => [r, files[r]])), main) }

async function rebuild(list = edits) {
  root.setAttribute('aria-busy', 'true')
  preview?.dispose()
  const model = modelOf(originals)
  preview = await E.createPreview(model, $('#stage'), { width: WIDTH[view], height: 800 })
  preview.iframe.title = 'Preview'
  const pair = (e) => ({ ...e, target: typeof e.target === 'string' ? E.select(preview.model, e.target) : e.target })
  session = E.applyEditSteps(preview, list.map(pair))
  const last = session.results[session.results.length - 1]
  root.removeAttribute('aria-busy')
  paint()
  return last
}
const cover = () => { let c = $('#cover'); if (!c) { c = document.createElement('div'); c.id = 'cover'; $('#stage').appendChild(c); wire(c) } return c }

function elementAt(x, y) {
  const e = preview.doc.elementFromPoint(x, y)
  return e && !['html', 'body'].includes(e.localName) && !(e.localName === 'svg' && !e.parentElement?.closest('svg') && e === preview.doc.documentElement) ? e : null
}
const idxOf = (e) => preview.elements.indexOf(e)
function rectOf(e) { const b = e.getBoundingClientRect(); return { left: b.left, top: b.top, width: b.width, height: b.height } }

function paint() {
  $('#stage').querySelectorAll('[data-selection]').forEach((n) => n.remove())
  cover()
  $('#undo').disabled = !edits.length; $('#redo').disabled = !redo.length
  const pins = E.listUnlinked(session?.state ?? E.emptyState())
  $('#review').textContent = `Review unlinked (${pins.length})`
  $('[data-env]').textContent = view
  $('#linklabel').textContent = view === 'Phone' ? 'Link to Desktop' : 'Link to Phone'
  $('#link').disabled = KIND[sample] === 'svg'
  $('[data-field="position"]').querySelectorAll('[data-dot]').forEach((n) => n.remove())
  $('[data-field="font-size"]').querySelectorAll('[data-dot]').forEach((n) => n.remove())
  if (sel !== null && preview.elements[sel]) {
    const el = preview.elements[sel]
    const b = rectOf(el)
    const box = document.createElement('div')
    box.setAttribute('data-selection', '')
    Object.assign(box.style, { left: b.left + 'px', top: b.top + 'px', width: b.width + 'px', height: b.height + 'px' })
    for (const [h, fx, fy] of [['nw', 0, 0], ['n', .5, 0], ['ne', 1, 0], ['e', 1, .5], ['se', 1, 1], ['s', .5, 1], ['sw', 0, 1], ['w', 0, .5]]) {
      const hd = document.createElement('div')
      hd.setAttribute('data-handle', h)
      Object.assign(hd.style, { left: fx * 100 + '%', top: fy * 100 + '%' })
      hd.addEventListener('pointerdown', (ev) => startDrag(ev, h))
      box.appendChild(hd)
    }
    $('#stage').appendChild(box)
    const cs = preview.doc.defaultView.getComputedStyle(el)
    const num = (v) => String(Math.round(parseFloat(v) * 100) / 100) + 'px'
    $('#f-font-size').value = num(cs.fontSize); $('#f-width').value = num(cs.width); $('#f-height').value = num(cs.height)
    $('[data-selected-label]').textContent = el.localName + (el.id ? ' #' + el.id : '')
    const path = E.describe(preview.model, sel)
    const mine = pins.filter((p) => p.selector === path)
    if (fault !== 'no-dot') {
      for (const p of mine) {
        const row = p.property === 'font-size' ? $('[data-field="font-size"]') : p.property === 'transform' || p.property === 'order' ? $('[data-field="position"]') : null
        if (row) { const d = document.createElement('span'); d.setAttribute('data-dot', ''); d.setAttribute('role', 'img'); d.setAttribute('aria-label', 'Unlinked'); row.appendChild(d) }
      }
    }
  } else { $('[data-selected-label]').textContent = ''; for (const f of ['font-size', 'width', 'height']) $('#f-' + f).value = '' }
  $('#file').innerHTML = FILES[sample]?.map((f) => `<option>${f}</option>`).join('') ?? ''
}

function wire(c) {
  c.addEventListener('pointerdown', (ev) => {
    const r = $('#stage').getBoundingClientRect()
    const e = elementAt(ev.clientX - r.left, ev.clientY - r.top)
    if (!e) { sel = null; paint(); return }
    if (sel !== null && preview.elements[sel] === e) return startDrag(ev, 'move')
    sel = idxOf(e); paint()
  })
}

function startDrag(ev, kind) {
  ev.stopPropagation()
  ev.target.setPointerCapture?.(ev.pointerId)
  const el = preview.elements[sel]
  const cs = preview.doc.defaultView.getComputedStyle(el)
  drag = { kind, x: ev.clientX, y: ev.clientY, w: parseFloat(cs.width), h: parseFloat(cs.height), id: ev.pointerId }
  const up = async (u) => {
    window.removeEventListener('pointerup', up)
    const k = fault === 'half-drag' ? 0.5 : 1
    const dx = (u.clientX - drag.x) * k, dy = (u.clientY - drag.y) * k
    const d = drag; drag = null
    if (d.kind === 'move') await apply({ op: 'offset', target: sel, dx: Math.round(dx), dy: Math.round(dy), environment: view === 'Phone' ? 'phone' : 'desktop', link: KIND[sample] === 'svg' })
    else {
      const props = {}
      if (d.kind.includes('e')) props.width = Math.round(d.w + dx) + 'px'
      if (d.kind.includes('s')) props.height = Math.round(d.h + dy) + 'px'
      await apply({ op: 'set', target: sel, properties: props, environment: view === 'Phone' ? 'phone' : 'desktop', link: $('#link').checked })
    }
  }
  window.addEventListener('pointerup', up)
}

async function apply(edit) {
  const path = E.describe(preview.model, edit.target)
  const mine = { ...edit, target: path }
  const list = [...edits, mine]
  if (fault === 'touch-neighbour') {
    const el = preview.elements[edit.target]
    const nb = el.nextElementSibling ?? el.previousElementSibling
    if (nb) list.push({ op: 'set', target: E.describe(preview.model, idxOf(nb)), properties: { color: '#336699' }, environment: 'desktop', link: true })
  }
  const keep = sel !== null ? path : null
  const last = await rebuild(list)
  if (last && !last.ok) { $('#msg').textContent = 'Not applied: ' + last.refusal.message; await rebuild(edits); return }
  edits = list; redo = []
  sel = keep ? E.select(preview.model, keep) : null
  paint()
}

$('#f-font-size').addEventListener('keydown', async (ev) => {
  if (ev.key !== 'Enter' || sel === null) return
  const v = ev.target.value.trim(); await apply({ op: 'set', target: sel, properties: { 'font-size': /^\d+(\.\d+)?$/.test(v) ? v + 'px' : v }, environment: view === 'Phone' ? 'phone' : 'desktop', link: $('#link').checked })
})
$('#sample').addEventListener('change', async (ev) => {
  sample = ev.target.value; originals = {}; edits = []; redo = []; sel = null
  for (const f of FILES[sample]) originals[f] = await textOf(f)
  await rebuild()
})
document.querySelectorAll('[aria-label="View"] button').forEach((b) => b.addEventListener('click', async () => {
  view = b.textContent; document.querySelectorAll('[aria-label="View"] button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
  preview.setWidth(WIDTH[view]); paint()
}))
$('#undo').addEventListener('click', async () => { redo.push(edits.pop()); const keep = sel !== null ? E.describe(preview.model, sel) : null; await rebuild(); sel = keep ? E.select(preview.model, keep) : null; paint() })
$('#redo').addEventListener('click', async () => { edits.push(redo.pop()); await rebuild() })
$('#download').addEventListener('click', async () => {
  let files = session.files
  if (fault === 'drop-last-edit' && edits.length) {
    const m = modelOf(originals); const p = await E.createPreview(m, document.body, { width: 1280, height: 800 })
    const r = E.applyEditSteps(p, edits.slice(0, -1).map((e) => ({ ...e, target: E.select(p.model, e.target) }))); files = r.files; p.dispose()
  }
  const name = $('#file').value
  let text = files[name]
  if (fault === 'extra-line' && name !== FILES[sample][0] || fault === 'extra-line' && FILES[sample].length === 1) text += '/* extra */\n'
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([text])); a.download = name === FILES[sample][0] ? name.replace(/(\.[^.]+)$/, '-edited$1') : name
  document.body.appendChild(a); a.click(); a.remove()
})
</script>
</body>
</html>
