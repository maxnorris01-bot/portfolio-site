<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI Editor gate, round 3: scorer-check stub</title>
<style>
  :root { --color-text: #0b1b33; --color-text-muted: #6c7686; --color-border: #c9c8c0; }
  body { font: 14px system-ui, sans-serif; margin: 12px; color: var(--color-text); }
  button, select, input { font: inherit; color: inherit; }
  .wrap { max-width: 1780px; margin: 0 auto; }
  [data-editor] { position: relative; }
  [hidden] { display: none !important; }
  button:focus-visible, select:focus-visible, input:focus-visible, [role=tab]:focus-visible, [data-code-view]:focus-visible { outline: 2px solid #e85d3f; outline-offset: 1px; }
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--color-border); }
  #bar button, #bar select { height: 32px; min-width: 32px; border: 1px solid var(--color-border); background: #fff; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; cursor: pointer; }
  #bar button:disabled { opacity: .45; }
  #bar svg { width: 20px; height: 20px; flex: none; }
  #tools { display: contents; }
  .flex { flex: 1 1 0; }
  .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 0 12px; }
  [aria-label="View"] { display: inline-flex; gap: 4px; }
  #bar [aria-label="View"] button[aria-pressed=true] { background: var(--color-text); color: #fff; border-color: var(--color-text); }
  body[data-fault=tablet-grey] #bar [aria-label="View"] button[aria-label=Tablet][aria-pressed=true] { background: #888; border-color: #888; }
  [data-gallery] { display: flex; gap: 16px; margin-top: 12px; }
  [data-sample-card] { width: 260px; border: 1px solid #ccc; padding: 8px; cursor: pointer; }
  [data-sample-card] h3 { margin: 4px 0; font-size: 15px; }
  .mini { position: relative; width: 260px; height: 162px; overflow: hidden; border: 1px solid #eee; }
  .mini iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; border: 0; transform: scale(0.203); transform-origin: 0 0; pointer-events: none; }
  [data-blank-page] { width: 100%; height: 100%; background: #fff; }
  #paste { margin-top: 12px; border: 1px solid #ccc; padding: 8px; }
  /* the ribbon: a tab bar and a fixed-height panel */
  [data-ribbon] { margin-top: 8px; border: 1px solid var(--color-border); box-sizing: border-box; }
  #tabbar { display: flex; align-items: flex-end; gap: 12px; height: 36px; padding: 0 8px; box-sizing: border-box; border-bottom: 1px solid var(--color-border); }
  [role=tablist] { display: flex; gap: 4px; }
  [role=tab] { padding: 6px 14px; cursor: pointer; border: 1px solid transparent; border-bottom: 0; }
  [role=tab][aria-selected=true] { border-color: var(--color-border); background: #f3f2ee; font-weight: 600; }
  [data-ribbon-note] { flex: 1 1 0; margin: 0; font-size: 12px; line-height: 15px; align-self: center; max-height: 30px; overflow: hidden; color: var(--color-text-muted); }
  #tabright { display: flex; gap: 10px; align-items: center; align-self: center; font-size: 12px; white-space: nowrap; }
  [data-ribbon-panel] { display: flex; height: 92px; box-sizing: border-box; padding: 4px 4px 0; align-items: stretch; }
  [data-ribbon-group] { position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 0 8px; border-right: 1px solid var(--color-border); }
  .gc { display: flex; gap: 4px; height: 60px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; gap: 4px; align-items: center; height: 28px; }
  [data-group-label] { font-size: 11px; line-height: 14px; text-align: center; color: var(--color-text-muted); padding-bottom: 6px; }
  [data-ribbon-panel] button, [data-ribbon-panel] select, [data-ribbon-panel] input:not([type=checkbox]) { height: 28px; box-sizing: border-box; font-size: 12px; border: 1px solid var(--color-border); background: #fff; border-radius: 3px; }
  [data-ribbon-panel] button:disabled, [data-ribbon-panel] select:disabled, [data-ribbon-panel] input:disabled { opacity: .5; }
  [data-ribbon-panel] input[type=text] { width: 52px; text-align: center; }
  [data-ribbon-panel] input[type=text][data-hex] { width: 70px; }
  [data-ribbon-panel] input[type=color] { width: 28px; padding: 1px; }
  [data-ribbon-panel] select { max-width: 120px; }
  [data-ribbon-panel] .step button { width: 22px; padding: 0; }
  .step { display: inline-flex; }
  [data-ribbon-panel] button.lg { width: 56px; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; font-size: 11px; }
  button.lg svg { width: 20px; height: 20px; }
  [data-ribbon-panel] button[aria-pressed=true] { background: var(--color-text); color: #fff; }
  [data-sides-popover] { position: absolute; top: 66px; left: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; max-width: 100%; border: 1px solid var(--color-border); background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  [data-snap-note] { margin: 0; width: 150px; font-size: 11px; line-height: 13px; color: var(--color-text-muted); }
  [data-stage-area] { display: flex; justify-content: center; margin-top: 8px; border: 1px solid #ccc; }
  [data-device-scale] { flex: none; transform-origin: top center; }
  .dev { box-sizing: border-box; background: #1b1b1f; position: relative; }
  .dev:not([data-device-frame]) { background: none; padding: 0 !important; border-radius: 0 !important; }
  #screen { position: relative; background: #fff; overflow: hidden; }
  #cover { position: absolute; inset: 0; }
  [data-grid-overlay] { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(to right, rgba(232,93,63,.45) 1px, transparent 1px), linear-gradient(to bottom, rgba(232,93,63,.45) 1px, transparent 1px); }
  [data-selection] { position: absolute; outline: 2px solid #e85d3f; pointer-events: none; }
  [data-handle] { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: #fff; border: 2px solid #e85d3f; pointer-events: auto; }
  [data-drag-label] { position: absolute; background: #123; color: #fff; padding: 2px 6px; z-index: 5; pointer-events: none; }
  .code { display: flex; gap: 4px; }
  [data-code-view] { flex: 1; height: 220px; overflow: auto; border: 1px solid #ccc; font: 12px/16px ui-monospace, monospace; white-space: pre; position: relative; }
  [data-line] { display: flex; height: 16px; }
  [data-line][data-change] { background: #fff2c9; }
  [data-margin-marker] { width: 18px; flex: none; text-align: center; }
  [data-removed] { height: 3px; background: #c33; margin: 0 0 -1px; }
  [data-change-map] { position: relative; width: 14px; height: 220px; background: #eee; }
  [data-change-map] button { position: absolute; left: 0; width: 14px; height: 3px; min-height: 0; padding: 0; margin-top: -1.5px; background: #e85d3f; border: 0; }
  @media (max-width: 999px) {
    #bar button, #bar select { min-height: 44px; min-width: 44px; }
    #tabbar { height: auto; flex-wrap: wrap; align-items: center; padding: 4px 8px; }
    [role=tab] { min-height: 44px; display: inline-flex; align-items: center; box-sizing: border-box; }
    [data-ribbon-panel] { height: auto; flex-wrap: wrap; }
    [data-ribbon-group] { flex: 1 1 100%; border-right: 0; padding: 4px 0; }
    .gc { height: auto; flex-wrap: wrap; }
    .col, .row { height: auto; flex-wrap: wrap; }
    [data-ribbon-panel] button, [data-ribbon-panel] select, [data-ribbon-panel] input:not([type=checkbox]) { min-height: 44px; min-width: 44px; height: 44px; }
    [data-ribbon-panel] button.lg { height: 60px; }
    [data-ribbon-panel] .step button { width: 44px; }
    [data-ribbon-panel] input[type=text] { width: 56px; }
    #tabright input[type=checkbox] { width: 44px; height: 44px; margin: 0; }
    #tabright label { min-height: 44px; display: inline-flex; align-items: center; }
    [data-sides-popover] { position: static; flex-direction: column; box-shadow: none; }
    [data-snap-note] { width: auto; }
    body[data-fault=small-390] [data-ribbon-panel] button:not(.lg), body[data-fault=small-390] [data-ribbon-panel] select, body[data-fault=small-390] [data-ribbon-panel] input:not([type=checkbox]) { min-height: 0; height: 28px; }
  }
  body[data-fault=heights-off] [data-ribbon-panel] button:not(.lg), body[data-fault=heights-off] [data-ribbon-panel] select { height: 36px; }
  body[data-fault=height-shifts] [data-ribbon-panel]#panel-layout { height: 104px; }
  .ue-section { margin-top: 24px; }
</style>
</head>
<body>
<!--
  The round 3 scorer-check stub (docs/ui-editor-gate-rules-round3.md): a deliberately small editor on the real engine that follows the round 3 UI contract
  (quick bar, tab bar with Home and Layout, fixed-height panel, Sides popover, grid overlay and snap, multi-file code view) just far enough to run T01 to
  T16 through the real gate runner, with faults ?fault=NAME:
    wrong-group       Border radius sits in the Size group, and Move up on the Home tab (T01)
    height-shifts     the Layout panel is taller than the Home panel (T02)
    heights-off       small controls are 36 px high (T03)
    reset-near-undo   Reset all sits next to Redo (T04)
    tablet-grey       the selected view button is grey in Tablet (T05)
    enabled-empty     ribbon controls are enabled with nothing selected (T06)
    sides-all         Top plus in the Sides popover changes all four sides (T07)
    grid-spacing      grid lines 1 px too far apart (T08)
    grid-ignores-scale the grid is drawn outside the scaled device, unscaled (T08/T11)
    grid-in-doc       a grid element is added inside the preview document (T08)
    snap-floor        snap rounds down instead of to the nearest line (T09)
    no-alt            Alt does not turn snap off (T09)
    snap-default-on   Snap is on at every page load (T09)
    grid-beats-full   a grid snap wins over the 100% snap (T10)
    svg-snap          Snap works on SVG (T12)
    no-switch         the code view never switches file by itself (T13, T14)
    only-shown        counts and walks only the shown file (T13, T14)
    copy-wrong-file   Copy code always copies the first file (T14)
    no-arrows         the tabs ignore the arrow keys (T15)
    small-390         controls are under 44 px at 390 (T16)
  It is not the product; it only lets the scorer be checked before the page is built.
-->
<div class="wrap">
<div data-editor>
  <div id="bar" role="group" aria-label="Editor controls">
    <button type="button" id="samples" aria-expanded="false">Samples</button>
    <span id="tools" hidden>
      <button type="button" id="undo" aria-label="Undo" title="Undo the last edit" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button type="button" id="redo" aria-label="Redo" title="Redo the edit" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button type="button" id="review" aria-label="Review unlinked (0)" title="Review unlinked edits" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4l16 16"/></svg></button>
      <span class="flex"></span>
      <span role="group" aria-label="View"><button type="button" aria-label="Desktop" aria-pressed="true" title="Show the Desktop size"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="12"/></svg><span>Desktop</span></button><button type="button" aria-label="Tablet" aria-pressed="false" title="Show the Tablet size"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="2" width="14" height="19"/></svg><span>Tablet</span></button><button type="button" aria-label="Phone" aria-pressed="false" title="Show the Phone size"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="7" y="2" width="10" height="19"/></svg><span>Phone</span></button></span>
      <button type="button" id="rotate" aria-label="Rotate" title="Turn the device sideways" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="10" width="6" height="11"/><path d="M6 7.5a8 8 0 0 1 12 0"/></svg><span>Rotate</span></button>
      <span class="flex"></span>
      <label for="file" hidden>File</label><select id="file" aria-label="File"></select>
      <button type="button" id="copy" aria-label="Copy code" title="Copy the file to the clipboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="9" width="11" height="11"/><path d="M5 15V6h9"/></svg><span>Copy code</span></button>
      <button type="button" id="download" aria-label="Download" title="Download the file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span>Download</span></button>
      <span class="sep"></span>
      <button type="button" id="reset" aria-label="Reset all" title="Reset every edit" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M13 3H6v18h5M13 3l5 5"/></svg><span>Reset all</span></button>
    </span>
  </div>
  <div id="confirm" role="group" aria-label="Confirm" hidden><p>Replace what is open? Your edits will be lost.</p><button type="button" id="discard">Discard edits</button><button type="button" id="keep">Keep editing</button></div>
  <div data-gallery role="region" aria-label="Sample gallery"></div>
  <div id="paste" role="group" aria-label="Paste code" hidden>
    <label for="pm">HTML or SVG</label><textarea id="pm" rows="4"></textarea>
    <label for="pc">Companion CSS (optional)</label><textarea id="pc" rows="2"></textarea>
    <button type="button" id="openpaste">Open pasted code</button><button type="button" id="cancelpaste">Cancel</button>
  </div>
  <input type="file" id="upfile" accept=".html,.htm,.svg,.css" multiple hidden>
  <div data-ribbon hidden></div>
  <div id="work" hidden>
    <div data-stage-area><div data-device-scale><div class="dev" id="dev"><div id="screen"><div id="host"></div><div id="cover"></div><div data-grid-overlay hidden></div></div></div></div></div>
  </div>
  <details id="codebox" hidden><summary>Updated code</summary>
    <div><button type="button" id="prevc">Previous change</button> <button type="button" id="nextc">Next change</button> <span data-change-counter>No changes yet</span></div>
    <div class="code"><div data-code-view tabindex="0" aria-label="Updated code"></div><div data-change-map></div></div>
  </details>
  <div role="status" aria-label="Edit result" id="msg"></div>
</div>
</div>
<script type="module">
import * as E from '/engine.js'
const fault = new URLSearchParams(location.search).get('fault')
const $ = (s) => document.querySelector(s)
document.body.dataset.fault = fault ?? ''
if (fault === 'reset-near-undo') { $('#redo').after($('#reset')); document.querySelector('.sep').remove() }
const FILES = { landing: ['landing.html', 'landing.css'], email: ['email.html'], chart: ['chart.svg'] }
const KIND = { landing: 'html', email: 'html', chart: 'svg' }
const TITLES = { landing: 'Landing page', email: 'HTML email', chart: 'SVG chart' }
const SIZES = { desktop: { portrait: [1280, null] }, tablet: { portrait: [768, 1024], landscape: [1024, 768] }, phone: { portrait: [390, 844], landscape: [844, 390] } }
const BEZEL = { phone: { portrait: [28, 12, 24, 12], landscape: [12, 24, 12, 28] }, tablet: { portrait: [12, 12, 12, 12], landscape: [12, 12, 12, 12] } }
const textOf = async (f) => (await fetch('/samples/' + f)).text()
let doc = null, originals = {}, edits = [], redo = [], preview = null, session = null, sel = null, view = 'desktop', orient = 'portrait', scale = 1, unit = 'px'
let jumpK = 0, shownFile = '', handPicked = false, gridOn = false, snapOn = fault === 'snap-default-on', spacing = 8, tab = 'home', altDown = false
addEventListener('keydown', (e) => { if (e.key === 'Alt') altDown = true })
addEventListener('keyup', (e) => { if (e.key === 'Alt') altDown = false })

// ---- the gallery: three samples and "Your own code" ----
for (const id of Object.keys(FILES)) {
  const files = {}
  for (const f of FILES[id]) files[f] = await textOf(f)
  const [main, ...rest] = FILES[id]
  const model = E.createModel(files[main], KIND[id], Object.fromEntries(rest.map((r) => [r, files[r]])), main)
  const c = document.createElement('div')
  c.setAttribute('data-sample-card', id); c.setAttribute('role', 'button'); c.tabIndex = 0
  c.innerHTML = `<div class="mini"><iframe data-miniature sandbox="allow-same-origin" tabindex="-1" title="Miniature of ${TITLES[id]}"></iframe></div><h3>${TITLES[id]}</h3><p>A sample.</p>`
  c.querySelector('iframe').srcdoc = E.previewSource(model)
  c.addEventListener('click', () => pick(() => loadSample(id)))
  $('[data-gallery]').appendChild(c)
}
{
  const c = document.createElement('div')
  c.setAttribute('data-sample-card', 'own')
  c.innerHTML = `<div class="mini"><div data-blank-page></div></div><h3>Your own code</h3><p>Paste or upload.</p><button type="button" id="own-paste">Paste</button> <button type="button" id="own-upload">Upload</button>`
  $('[data-gallery]').appendChild(c)
}
let pending = null
const pick = (run) => { if (edits.length) { pending = run; $('#confirm').hidden = false } else run() }
$('#keep').addEventListener('click', () => { pending = null; $('#confirm').hidden = true })
$('#discard').addEventListener('click', () => { const r = pending; pending = null; $('#confirm').hidden = true; r() })
$('#samples').addEventListener('click', () => {
  const g = $('[data-gallery]'); $('#paste').hidden = true
  g.hidden = doc ? !g.hidden : false
  $('#samples').setAttribute('aria-expanded', String(!g.hidden))
})
$('#own-paste').addEventListener('click', () => { $('#paste').hidden = false; $('[data-gallery]').hidden = true })
$('#cancelpaste').addEventListener('click', () => { $('#paste').hidden = true; if (!doc) $('[data-gallery]').hidden = false })
$('#own-upload').addEventListener('click', () => $('#upfile').click())

async function loadSample(id) {
  const files = {}
  for (const f of FILES[id]) files[f] = await textOf(f)
  open_({ id, order: FILES[id], files, kind: KIND[id], main: FILES[id][0] })
}
async function open_(d) {
  doc = d; originals = { ...d.files }; edits = []; redo = []; sel = null; view = 'desktop'; orient = 'portrait'; jumpK = 0; unit = 'px'
  shownFile = d.order[0]; handPicked = false
  $('[data-gallery]').hidden = true; $('#paste').hidden = true; $('#samples').setAttribute('aria-expanded', 'false')
  $('#tools').hidden = false; $('#work').hidden = false; $('[data-ribbon]').hidden = false; $('#codebox').hidden = false
  document.querySelectorAll('[aria-label="View"] button').forEach((x) => x.setAttribute('aria-pressed', String(x.getAttribute('aria-label') === 'Desktop')))
  await rebuild()
}
const modelOf = () => { const [main, ...rest] = doc.order; return E.createModel(originals[main], doc.kind, Object.fromEntries(rest.map((r) => [r, originals[r]])), main) }

// ---- the device ----
function layout() {
  const [w, h] = SIZES[view][orient]
  const framed = view !== 'desktop'
  const [bt, br, bb, bl] = framed ? BEZEL[view][orient] : [0, 0, 0, 0]
  const ih = h ?? 800
  const frameW = w + bl + br, frameH = ih + bt + bb
  const area = $('[data-stage-area]').clientWidth
  scale = Math.min(1, area / frameW, framed ? (innerHeight - 16) / frameH : 1)
  const sc = $('[data-device-scale]'), dev = $('#dev')
  Object.assign(sc.style, { width: frameW + 'px', transform: scale < 1 ? `scale(${scale})` : '', marginBottom: -(frameH * (1 - scale)) + 'px' })
  dev.toggleAttribute('data-device-frame', framed)
  if (framed) { dev.dataset.device = view; dev.dataset.orientation = orient } else { delete dev.dataset.device; delete dev.dataset.orientation }
  Object.assign(dev.style, { width: frameW + 'px', height: frameH + 'px', padding: `${bt}px ${br}px ${bb}px ${bl}px`, borderRadius: framed ? '24px' : '0' })
  Object.assign($('#screen').style, { width: w + 'px', height: ih + 'px' })
  if (preview) { preview.iframe.style.height = ih + 'px'; preview.setWidth(w) }
  $('#rotate').hidden = !framed
  paintGrid()
}
addEventListener('resize', () => { if (preview) { layout(); paint() } })
const editable = () => view === 'desktop' || (view === 'phone' && orient === 'portrait')

function paintGrid() {
  const o = $('[data-grid-overlay]')
  o.hidden = !gridOn
  const s = fault === 'grid-spacing' ? spacing + 1 : spacing
  o.style.backgroundSize = `${s}px ${s}px`
  document.querySelectorAll('[data-fault-grid]').forEach((n) => n.remove())
  if (fault === 'grid-ignores-scale') {
    // drawn over the stage in screen px, outside the scaled device, so it does not follow the scale
    const a = $('[data-stage-area]'); a.style.position = 'relative'
    if (o.parentElement !== a) a.appendChild(o)
    const f = $('iframe[title="Preview"]')
    if (f && gridOn) { const r = f.getBoundingClientRect(), ar = a.getBoundingClientRect(); Object.assign(o.style, { inset: 'auto', left: r.left - ar.left + 'px', top: r.top - ar.top + 'px', width: r.width + 'px', height: r.height + 'px' }) }
  }
  if (fault === 'grid-in-doc' && gridOn && preview) {
    const d = preview.doc.createElement('div'); d.setAttribute('data-grid-overlay', ''); d.setAttribute('data-fault-grid', ''); preview.doc.body.appendChild(d)
  }
}

async function rebuild(list = edits) {
  $('[data-editor]').setAttribute('aria-busy', 'true')
  preview?.dispose()
  preview = await E.createPreview(modelOf(), $('#host'), { width: SIZES[view][orient][0], height: SIZES[view][orient][1] ?? 800 })
  preview.iframe.title = 'Preview'
  const pair = (e) => ({ ...e, target: typeof e.target === 'string' ? E.select(preview.model, e.target) : e.target })
  session = E.applyEditSteps(preview, list.map(pair))
  const last = session.results[session.results.length - 1]
  $('[data-editor]').removeAttribute('aria-busy')
  layout(); paint()
  return last
}
const idxOf = (e) => preview.elements.indexOf(e)
const scope = () => ({ environment: view === 'phone' ? 'phone' : 'desktop', link: doc.kind === 'svg' ? true : $('#link')?.checked !== false })
/** After any change of the edit list: the counter starts again, and the shown file moves to the first changed file when it has no change of its own (never after a hand pick). */
function afterEdit() {
  jumpK = 0
  if (fault === 'no-switch' || handPicked || !session) return
  if (fileHunks(shownFile).length === 0) { const f = doc.order.find((x) => fileHunks(x).length > 0); if (f) shownFile = f }
}
async function apply(edit) {
  const path = E.describe(preview.model, edit.target)
  const list = [...edits, { ...edit, target: path }]
  const keep = sel !== null && edit.op !== 'reorder' ? path : null
  const last = await rebuild(list)
  if (last && !last.ok) { $('#msg').textContent = 'Not applied: ' + last.refusal.message; await rebuild(edits); return }
  edits = list; redo = []
  sel = keep ? E.select(preview.model, keep) : null
  $('#msg').textContent = 'Applied.'
  afterEdit(); paint()
}

// ---- the ribbon ----
const FAMS = ['Georgia', 'Times New Roman', 'Arial', 'Helvetica', 'Verdana', 'Trebuchet MS', 'Tahoma', 'Courier New', 'system-ui', 'serif', 'sans-serif', 'monospace']

function stepFor(name, shift) {

}
const cs = () => preview.doc.defaultView.getComputedStyle(preview.elements[sel])

  if (n === 'Width') return unit === '%' ? Math.round((px(c.width) / parentW()) * 10000) / 100 : px(c.width)

function paintRibbon() {
  const on = sel !== null && !!preview.elements[sel] && editable()
  const el = on ? preview.elements[sel] : null
  for (const c of ribbonControls()) c.disabled = fault === 'enabled-empty' ? false : !on
  $('#link').disabled = fault === 'enabled-empty' ? false : !on
  $('#linklabel').textContent = view === 'phone' ? 'Link to Desktop' : 'Link to Phone'
  const note = sel === null || !preview.elements[sel] ? (editable() ? 'Click an element to edit it' : 'This size is view-only, so its settings are switched off.') : (editable() ? '' : 'This size is view-only, so its settings are switched off.')

  const f = $('#i-ff')
  if (el) {
    const c = cs()
    f.innerHTML = [c.fontFamily, ...FAMS].map((o) => `<option>${o.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</option>`).join(''); f.selectedIndex = 0

function paint() {
  $('#screen').querySelectorAll('[data-selection]').forEach((n) => n.remove())
  $('#undo').disabled = !edits.length; $('#redo').disabled = !redo.length; $('#reset').disabled = !edits.length
  const pins = E.listUnlinked(session?.state ?? E.emptyState())
  $('#review').setAttribute('aria-label', `Review unlinked (${pins.length})`)
  if (sel !== null && preview.elements[sel]) {
    const b = preview.elements[sel].getBoundingClientRect()
    const box = document.createElement('div')
    box.setAttribute('data-selection', '')
    Object.assign(box.style, { left: b.left + 'px', top: b.top + 'px', width: b.width + 'px', height: b.height + 'px' })
    if (editable()) for (const [h, fx, fy] of [['nw', 0, 0], ['n', .5, 0], ['ne', 1, 0], ['e', 1, .5], ['se', 1, 1], ['s', .5, 1], ['sw', 0, 1], ['w', 0, .5]]) {
      const hd = document.createElement('div'); hd.setAttribute('data-handle', h)
      Object.assign(hd.style, { left: fx * 100 + '%', top: fy * 100 + '%' })

    }

// ---- the stub's own line diff and code view over every file ----
const linesOf = (t) => { const l = t.split('\n'); if (l.length > 1 && l[l.length - 1] === '') l.pop(); return l }
function hunks(a, b) {
  const x = linesOf(a), y = linesOf(b), m = x.length, n = y.length
  const L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0))
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1])
  const out = []; let cur = null, i = 0, j = 0
  while (i < m || j < n) {
    if (i < m && j < n && x[i] === y[j]) { cur = null; i++; j++ }
    else { if (!cur) { cur = { removed: 0, added: 0, after: j }; out.push(cur) } if (j >= n || (i < m && L[i + 1][j] >= L[i][j + 1])) { cur.removed++; i++ } else { cur.added++; j++ } }
  }
  return out
}
const fileHunks = (f) => (session ? hunks(originals[f], session.files[f] ?? originals[f]) : [])
const allChanges = () => (fault === 'only-shown' ? fileHunks(shownFile).map((h, i) => ({ f: shownFile, i })) : doc.order.flatMap((f) => fileHunks(f).map((h, i) => ({ f, i }))))
function paintCode() {
  const file = shownFile
  const marks = doc.order.map((f) => [f, fileHunks(f).length])
  $('#file').innerHTML = marks.map(([f, n]) => `<option value="${f}">${n ? `${f} (${n})` : f}</option>`).join('')
  $('#file').value = file
  $('#copy').title = `Copy ${file} to the clipboard`; $('#download').title = `Download ${file}`
  const now = session.files[file] ?? originals[file]
  const hs = hunks(originals[file], now)
  const ls = linesOf(now)
  const box = $('[data-code-view]'); box.innerHTML = ''
  ls.forEach((t, i) => {
    const n = i + 1
    const k = hs.findIndex((h) => h.added > 0 && n >= h.after + 1 && n <= h.after + h.added) + 1
    const row = document.createElement('div'); row.setAttribute('data-line', String(n))
    if (k) row.setAttribute('data-change', String(k))
    row.innerHTML = `<span data-margin-marker>${k ? '+' : ''}</span><span data-code-text></span>`
    row.querySelector('[data-code-text]').textContent = t
    box.appendChild(row)
  })

    if (!h.removed) return
    const r = document.createElement('div'); r.setAttribute('data-removed', ''); r.setAttribute('data-removed-after', String(h.after)); r.setAttribute('data-change', String(idx + 1))
    box.insertBefore(r, box.querySelector(`[data-line="${h.after + 1}"]`))
  })
  const map = $('[data-change-map]'); map.innerHTML = ''
  hs.forEach((h, idx) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', `Change ${idx + 1} of ${hs.length}`); b.style.top = (h.after / ls.length) * 100 + '%'; b.addEventListener('click', () => jumpTo(offsetOf(file) + idx + 1)); map.appendChild(b) })

  $('#prevc').disabled = $('#nextc').disabled = n === 0
}
const offsetOf = (file) => { let o = 0; for (const f of doc.order) { if (f === file) return o; o += fileHunks(f).length } return o }

function jumpTo(k) {
  const all = allChanges(), t = all[k - 1]
  if (!t) return
  jumpK = k; shownFile = t.f; paintCode()
  const box = $('[data-code-view]')
  const el = box.querySelector(`[data-line][data-change="${t.i + 1}"]`) ?? box.querySelector(`[data-removed][data-change="${t.i + 1}"]`)
  if (el) box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight / 2)
}
$('#nextc').addEventListener('click', () => { const n = allChanges().length; jumpTo(jumpK >= n ? 1 : jumpK + 1) })

// ---- pointer layer, drag, grid snap ----
$('#cover').addEventListener('pointerdown', (ev) => {
  const r = $('#cover').getBoundingClientRect()
  const x = (ev.clientX - r.left) / scale, y = (ev.clientY - r.top) / scale
  const e = preview.doc.elementFromPoint(x, y)
  if (!e || ['html', 'body'].includes(e.localName)) { sel = null; paint(); return }
  if (sel !== null && preview.elements[sel] === e) return startDrag(ev, 'move')
  sel = idxOf(e); paint()
})
const nearest = (v, s) => (fault === 'snap-floor' ? Math.floor(v / s) * s : Math.round(v / s) * s)
const snapping = (alt) => snapOn && doc.kind !== 'svg' || (fault === 'svg-snap' && snapOn) ? (fault === 'no-alt' ? true : !alt) : false
function startDrag(ev, kind) {
  ev.stopPropagation(); ev.target.setPointerCapture?.(ev.pointerId)
  const el = preview.elements[sel], c = cs()
  const rect0 = el.getBoundingClientRect()
  const win = preview.doc.defaultView
  const d = { kind, x: ev.clientX, y: ev.clientY, w: parseFloat(c.width), h: parseFloat(c.height), right: rect0.right, left: rect0.left, top: rect0.top }
  const pr = el.parentElement.getBoundingClientRect(), pc = win.getComputedStyle(el.parentElement)
  const edge = pr.left + el.parentElement.clientLeft + parseFloat(pc.paddingLeft) + parentW()
  const label = document.createElement('div'); label.setAttribute('data-drag-label', ''); $('#screen').appendChild(label)
  const move = (m) => {
    const dx = (m.clientX - d.x) / scale
    const nr = d.right + dx
    label.textContent = kind.includes('e') && Math.abs(nr - edge) <= 2 ? 'Full width' : `${Math.round(d.w + dx)}`
  }
  addEventListener('pointermove', move)
  const up = async (u) => {
    removeEventListener('pointerup', up); removeEventListener('pointermove', move); label.remove()
    const dx = (u.clientX - d.x) / scale, dy = (u.clientY - d.y) / scale
    const snap = snapping(u.altKey || altDown)
    if (kind === 'move') {
      if (!snap) return doNudge(Math.round(dx), Math.round(dy))
      const ox = win.scrollX, oy = win.scrollY
      const tx = nearest(d.left + ox + Math.round(dx), spacing) - (d.left + ox), ty = nearest(d.top + oy + Math.round(dy), spacing) - (d.top + oy)
      return doNudge(tx, ty)
    }
    const props = {}
    if (kind.includes('e')) {
      const nr = d.right + dx
      const full = Math.abs(nr - edge) <= 2
      if (full && !(snap && fault === 'grid-beats-full')) props.width = '100%'
      else if (snap) props.width = Math.round(nearest(nr + win.scrollX, spacing) - win.scrollX - d.left) + 'px'
      else props.width = unit === '%' ? Math.round(((d.w + dx) / parentW()) * 10000) / 100 + '%' : Math.round(d.w + dx) + 'px'
    }
    if (kind.includes('s')) props.height = Math.round(d.h + dy) + 'px'
    await doSet(props)
  }
  addEventListener('pointerup', up)
}

// ---- view, history, export ----
document.querySelectorAll('[aria-label="View"] button').forEach((b) => b.addEventListener('click', () => {
  view = b.getAttribute('aria-label').toLowerCase(); orient = 'portrait'
  document.querySelectorAll('[aria-label="View"] button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
  layout(); paint()
}))
$('#rotate').addEventListener('click', () => { orient = orient === 'portrait' ? 'landscape' : 'portrait'; layout(); paint() })
$('#undo').addEventListener('click', async () => { const keep = sel !== null ? E.describe(preview.model, sel) : null; redo.push(edits.pop()); await rebuild(); sel = keep ? E.select(preview.model, keep) : null; afterEdit(); paint() })
$('#redo').addEventListener('click', async () => { edits.push(redo.pop()); await rebuild(); afterEdit(); paint() })
$('#reset').addEventListener('click', async () => { edits = []; redo = []; await rebuild(); afterEdit(); paint() })
const fileText = () => session.files[$('#file').value]
$('#copy').addEventListener('click', async () => { await navigator.clipboard.writeText(fault === 'copy-wrong-file' ? session.files[doc.order[0]] : fileText()); $('#msg').textContent = 'Copied ' + $('#file').value + '.' })
$('#download').addEventListener('click', () => {
  const name = $('#file').value
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([fileText()])); a.download = name === doc.order[0] ? name.replace(/(\.[^.]+)$/, '-edited$1') : name
  document.body.appendChild(a); a.click(); a.remove()
})
</script>
</body>
</html>
