<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harvest Table</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #222222; background: #fafafa; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px; }
  #title { margin: 0 0 12px; font-size: 40px; line-height: 1.2; }
  #intro { margin: 0 0 20px; font-size: 18px; line-height: 1.5; }
  #panel { width: 480px; padding: 24px; background: #ffffff; border: 1px solid #cccccc; }
  #note { margin: 0; font-size: 16px; }
  @media (max-width: 768px) {
    .wrap { padding: 16px; }
    #title { font-size: 28px; }
    #panel { width: 100%; padding: 16px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">Harvest table for the autumn</h1>
    <p id="intro">Long tables, shared plates and a menu that changes with the weather.</p>
    <div id="panel">
      <p id="note">Doors open at five.</p>
    </div>
  </div>
</body>
</html>
